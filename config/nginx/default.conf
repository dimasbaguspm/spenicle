# The `web` image: the same `dist` the full image embeds, served on the API's port so a split
# deploy only has to point one upstream at the other. The API path is *not* proxied here:
# whoever runs two containers decides the address, and a hardcoded upstream would be wrong for
# everyone (see the README's four-images table).
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vite fingerprints every file under /assets/, so a stale one is impossible.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The shell and the service worker must revalidate, or an install pins an old build.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
