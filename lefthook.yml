# lefthook: the git hooks for this repository.
#
#   make hooks          # install once per clone (runs `lefthook install`)
#   lefthook run pre-commit   # run the hook by hand
#   git commit --no-verify    # skip it — say why in the MR if you do
#
# A hook people bypass is a hook that does not exist. Pre-commit is piped:
# lint runs first and a finding stops the commit before the slower checks.
# The four checks are the four checks CI runs.

pre-commit:
  piped: true
  jobs:
    - name: lint
      glob: "**/*.go"
      run: make lint

    - name: build
      glob: "**/*.go"
      run: go build ./...


    # Unit and adapter tests. UAT has its own job so a Gherkin failure is named
    # as such instead of hidden inside `make test`.
    - name: test
      glob: "**/*.go"
      run: make test

    - name: uat
      glob: "**/*.go"
      run: make uat

    # The SPA has its own gate: install from the frozen lockfile, build, then
    # tsgo + oxlint + oxfmt --check + vitest. Only when web/ is part of the change.
    - name: web
      glob: "web/**"
      run: make web web-check

# Pushing is the last cheap place to catch a broken tree; skip it with `git push
# --no-verify` when you have already run the pre-commit hook.
pre-push:
  parallel: true
  jobs:
    - name: build
      glob: "**/*.go"
      run: go build ./...

    - name: uat
      glob: "**/*.go"
      run: make uat

    - name: web
      glob: "web/**"
      run: make web web-check
