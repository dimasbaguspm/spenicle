name: release

# A release is one annotated semver tag: `git tag -a v0.2.0 -m v0.2.0 && git push origin v0.2.0`.
# It publishes four container images from docker-bake.hcl and a release whose notes link every commit.
on:
  push:
    tags: ['v*']

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve version
        id: v
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "tag '$TAG' is not vMAJOR.MINOR.PATCH" >&2; exit 1; }
          SHA7="$(git rev-parse --short=7 HEAD)"
          echo "version=$TAG"        >> "$GITHUB_OUTPUT"
          echo "short=${TAG#v}"      >> "$GITHUB_OUTPUT"
          echo "sha7=$SHA7"          >> "$GITHUB_OUTPUT"
          echo "full=$TAG+$SHA7"     >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # One build for four images: bake shares the Dockerfile's `gosrc`, `spa` and `runtime`
      # stages, so the second, third and fourth target cost a copy layer, not a rebuild.
      - name: Build and push
        env:
          VERSION: ${{ steps.v.outputs.version }}
          SHORT: ${{ steps.v.outputs.short }}
          SHA7: ${{ steps.v.outputs.sha7 }}
          REPO: ${{ github.repository }}
        run: docker buildx bake --push

      - name: Write notes
        env:
          VERSION: ${{ steps.v.outputs.version }}
          FULL: ${{ steps.v.outputs.full }}
          SHA7: ${{ steps.v.outputs.sha7 }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          prev="$(git describe --tags --abbrev=0 "${VERSION}^" 2>/dev/null || true)"
          if [ -n "$prev" ]; then range="${prev}..${VERSION}"; else range="${VERSION}"; fi

          {
            echo "The release is a container image. Nothing to download, nothing to unpack."
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| images | \`ghcr.io/${REPO}:latest\`, \`:server\`, \`:web\`, \`:cli\` |"
            echo "| version in \`/healthz\` | \`${FULL}\` |"
            echo "| commit | [\`${SHA7}\`](${BASE}/commit/$GITHUB_SHA) |"
            echo
            echo "## Changes since ${prev:-the first tag}"
            echo
            git log --no-merges --pretty="- [\`%h\`](${BASE}/commit/%H) %s" "$range"
            echo
            if [ -n "$prev" ]; then
              echo "**Full diff:** [${prev}...${VERSION}](${BASE}/compare/${prev}...${VERSION})"
            else
              echo "**All commits:** [${VERSION}](${BASE}/commits/${VERSION})"
            fi
          } > notes.md

          cat notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.v.outputs.version }}
        run: gh release create "$VERSION" --title "$VERSION" --notes-file notes.md
