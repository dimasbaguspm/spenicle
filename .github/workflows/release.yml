name: release

# One way in: push an annotated semver tag. Nothing else creates a release.
#
#   git tag -a v0.2.0 -m "v0.2.0"
#   git push origin v0.2.0
#
# What it produces: the container image on GHCR and a GitHub release whose notes
# link every commit. No binary assets — the image is the only artifact.
on:
  push:
    tags: ['v*']

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: publish image and notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve version
        id: v
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if ! printf '%s' "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "tag '$VERSION' is not semver (vMAJOR.MINOR.PATCH); refusing to release" >&2
            exit 1
          fi

          SHA7="$(git rev-parse --short=7 HEAD)"

          {
            echo "version=$VERSION"
            echo "short=${VERSION#v}"
            echo "sha7=$SHA7"
            echo "full=${VERSION}+${SHA7}"
          } >> "$GITHUB_OUTPUT"

          echo "releasing $VERSION at $SHA7"

      # QEMU runs the arm64 toolchain on the amd64 runner; without it the second
      # platform fails with "exec format error".
      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Publish image
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # The image is the whole distribution, so build the two architectures
          # a self-hoster actually runs: a server and a Raspberry Pi.
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ steps.v.outputs.full }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.v.outputs.version }}
            ghcr.io/${{ github.repository }}:${{ steps.v.outputs.short }}
            ghcr.io/${{ github.repository }}:sha-${{ steps.v.outputs.sha7 }}
            ghcr.io/${{ github.repository }}:latest
          labels: |
            org.opencontainers.image.version=${{ steps.v.outputs.full }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Collect the changes
        env:
          VERSION: ${{ steps.v.outputs.version }}
          SHORT: ${{ steps.v.outputs.short }}
          FULL: ${{ steps.v.outputs.full }}
          SHA7: ${{ steps.v.outputs.sha7 }}
          DIGEST: ${{ steps.image.outputs.digest }}
          REPO: ${{ github.repository }}
          SERVER: ${{ github.server_url }}
        run: |
          set -euo pipefail

          base="$SERVER/$REPO"

          prev="$(git describe --tags --abbrev=0 "${VERSION}^" 2>/dev/null || true)"

          if [ -n "$prev" ]; then
            range="${prev}..${VERSION}"
            heading="Changes since ${prev}"
            diff="**Full diff:** [${prev}...${VERSION}](${base}/compare/${prev}...${VERSION})"
          else
            range="${VERSION}"
            heading="Every commit up to ${VERSION}"
            diff="**All commits:** [${VERSION}](${base}/commits/${VERSION})"
          fi

          {
            echo "The release is a container image. Nothing to download, nothing to unpack."
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| image | [\`ghcr.io/${REPO}:${VERSION}\`](${base}/pkgs/container/$(basename "$REPO")) |"
            echo "| digest | \`${DIGEST}\` |"
            echo "| platforms | \`linux/amd64\`, \`linux/arm64\` |"
            echo "| commit | [\`${SHA7}\`](${base}/commit/${GITHUB_SHA}) |"
            echo "| version in \`/healthz\` | \`${FULL}\` |"
            echo
            echo "## ${heading}"
            echo
            # Every commit is a link: the notes are meant to be clicked, not read
            # as plain text.
            git log --no-merges --pretty="- [\`%h\`](${base}/commit/%H) %s" "$range"
            echo
            echo "$diff"
          } > notes.md

          cat notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes-file notes.md
