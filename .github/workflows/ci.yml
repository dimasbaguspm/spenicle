name: ci

# Speed of ship: build, unit tests, UAT and lint run as four parallel jobs.
# Lint is one runner with four steps so every config still has its own report,
# and no finding hides another behind a failed earlier step.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Unit and integration tests
        run: make test

  uat:
    name: uat
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: UAT
        run: make uat

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Correctness
        id: lint_correctness
        continue-on-error: true
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4
          args: -c tools/lint/correctness.yml

      - name: Style
        id: lint_style
        continue-on-error: true
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4
          args: -c tools/lint/style.yml

      - name: Security
        id: lint_security
        continue-on-error: true
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4
          args: -c tools/lint/security.yml

      - name: Performance
        id: lint_performance
        continue-on-error: true
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4
          args: -c tools/lint/performance.yml

      - name: Report lint findings
        if: ${{ always() && steps.lint_performance.outcome != '' }}
        run: |
          failed=""
          check() {
            if [ "$2" != "success" ]; then
              failed="$failed $1"
            fi
          }
          check correctness "${{ steps.lint_correctness.outcome }}"
          check style "${{ steps.lint_style.outcome }}"
          check security "${{ steps.lint_security.outcome }}"
          check performance "${{ steps.lint_performance.outcome }}"
          if [ -n "$failed" ]; then
            echo "::error::lint failed:$failed"
            exit 1
          fi
