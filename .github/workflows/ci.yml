name: ci

# Speed of ship: build, unit tests, UAT and lint run as four parallel jobs.
# Lint is one runner with four steps so every config still has its own report,
# and no finding hides another behind a failed earlier step.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # `make web` shells out to pnpm, so the runner needs the same pair `mise.toml` pins.
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5

      - uses: actions/setup-node@v7
        with:
          node-version: 26.5.1
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build
        run: go build ./...

      # The full image compiles with `-tags web`, which embeds web/dist: prove that build
      # works on every push instead of discovering it during a release.
      - name: Build with the SPA embedded
        run: make web && go build -tags web ./...

  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5

      - uses: actions/setup-node@v7
        with:
          node-version: 26.5.1
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # The same gate the pre-commit hook runs: build, then tsgo + oxlint + oxfmt --check
      # + vitest. Without this job a PR could typecheck nowhere but a laptop.
      - name: Build and check the SPA
        run: make web web-check

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Unit and integration tests
        run: make test

  uat:
    name: uat
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: UAT
        run: make uat

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Correctness
        id: lint_correctness
        continue-on-error: true
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4
          args: -c tools/lint/correctness.yml

      - name: Style
        id: lint_style
        continue-on-error: true
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4
          args: -c tools/lint/style.yml

      - name: Security
        id: lint_security
        continue-on-error: true
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4
          args: -c tools/lint/security.yml

      - name: Performance
        id: lint_performance
        continue-on-error: true
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4
          args: -c tools/lint/performance.yml

      - name: Report lint findings
        if: ${{ always() && steps.lint_performance.outcome != '' }}
        run: |
          failed=""
          check() {
            if [ "$2" != "success" ]; then
              failed="$failed $1"
            fi
          }
          check correctness "${{ steps.lint_correctness.outcome }}"
          check style "${{ steps.lint_style.outcome }}"
          check security "${{ steps.lint_security.outcome }}"
          check performance "${{ steps.lint_performance.outcome }}"
          if [ -n "$failed" ]; then
            echo "::error::lint failed:$failed"
            exit 1
          fi
